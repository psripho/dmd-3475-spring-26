<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leanring about fetch</title>
</head>
<body>
    <h1>learinng about fetch</h1>
    <ul id="catFacts"></ul>


    <script>
        // JSON

        var simpleObject = {
            'name' : 'Joel',
            'role' : 'display'
        };

        console.log(simpleObject);

        var catFacts = [
            "Prima loves cats",
            "Prima is allergic to cats"
        ];

        function renderList(){
            const ulElement = document.getElementById('catFacts');
            catFacts.forEach(fact => {
                const li = document.createElement('li');
                li.textContent = fact;
                ulElement.appendChild(li);
            });
        }

            function getCatFacts(count) {
                fetch('https://meowfacts.herokuapp.com?count=${count}')
                .then(response => response.json())
                .then(function (data) {
                     catFacts = data.data;
                     renderList();
                }
                )
            }

            // renderList();

            getCatFacts(1);

            function getDogBreeds() {
                // get first 10 breeds
                fetch('https://dogapi.dog/api/v2/breeds?page[size]=10')
                .then(response => response.json())
                .then(function (data) {
                    var dogBreeds = data.data; //array of dog breeds

                    console.log(dogBreeds[0]);
                    console.log(dogBreeds[0].attributes.name);
                    console.log(dogBreeds[0].attributes.description);
                    console.log(dogBreeds[0].attributes.female_weight.max);
                });
            }

            getDogBreeds();
    
    </script>
</body>
</html>
