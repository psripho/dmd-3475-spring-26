<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prima's Playlists</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>

</head>
<body>
<h1>Prima's Playlists</h1>

    <main class="pp-main">
  
      <section class="left-col">
        <div id="moods">
            <h2>select your mood</h2>
            <div id="mood-select">
                <input type="radio" id="happy" name="mood" value="happy">
                <label for="happy">happy</label> <br>

                <input type="radio" id="sad" name="mood" value="sad">
                <label for="sad">sad</label> <br>

                <input type="radio" id="late-night" name="mood" value="late">
                <label for="late-night">late night</label> <br>

                <input type="radio" id="angry" name="mood" value="angry">
                <label for="angry">angry</label> <br>
            </div>
        </div>
        <div id="now-playing">
            <iframe
                id="embed-iframe"
                width="100%"
                height="360"
                frameborder="0"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
            </iframe>
        </div>
    </section>
      <section class="middle-col">
          <div id="background">
            <div class="bg-layer bg1"></div>
            <div class="bg-layer bg2"></div>
            <div id="color-overlay"></div>
            <img id="overlay-gif" src="" alt="">
          </div>
      </section>
  
      <section class="right-col">
        <h2>to-do list</h2>

               <div class="task-list">
          <input type="text" id="task" placeholder="new task..." />
          <button type="button" onclick="addTask()" class="addTask btn btn-dark rounded-0"> + </button>
        
          <div class="controls">
            <button onclick="setFilter('all')">All</button>
            <button onclick="setFilter('active')">Active</button>
            <button onclick="setFilter('completed')">Completed</button>
        
            <button onclick="sortTasks('newest')">Newest</button>
            <button onclick="sortTasks('oldest')">Oldest</button>
            <button onclick="sortTasks('alphabetical')">A-Z</button>
          </div>
        
          <ul id="list">
          </ul>
          <button onclick="clearAll()">clear all</button>
        </div>
        
        </section>
    </main>


    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

</body>
